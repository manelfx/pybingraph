[project]
name = "pybingraph"
dynamic = ["version"]
description = "Binary inspection API and UI using angr"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Manel Fernandez", email = "manel.fernandez@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["angr", "binary-analysis", "control-flow-graph", "disassembly"]
dependencies = [
    # Keep the release on the IR stack validated by our unit and golden corpuses.
    "angr==10.0.4",
    # PyVEX needs ConstBitStream, which bitstring 5 removed.
    "bitstring>=4.4,<5",
    "cxxfilt>=0.3.0",
    "fastapi>=0.143.2",
    "graphviz>=0.20.3",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pyelftools>=0.33",
    "pydot>=4.0.1",
    "pydantic-settings>=2.16.0",
    #"streamlit>=1.35.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/manelfx/pybingraph"
Repository = "https://github.com/manelfx/pybingraph"
Issues = "https://github.com/manelfx/pybingraph/issues"
Changelog = "https://github.com/manelfx/pybingraph/releases"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.88",
]

[project.scripts]
bingraph = "bingraph.api.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bingraph"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml",
    "/scripts/hatch_build.py",
]

[tool.hatch.version]
source = "code"
path = "src/bingraph/version.py"
expression = "get_version()"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "LICENSE" },
    { file = "NOTICE" },
    { file = "scripts/hatch_build.py" },
    { file = "src/bingraph/version.py" },
    { git = { commit = true } },
]

[tool.pytest.ini_options]
testpaths = ["tests/units"]
markers = [
    "checkpoint: curated CFG golden regression cases",
    "slow: integration tests that require playground binaries",
]

[tool.ruff.lint]
# Keep the existing checks independent of Ruff's expanded default rule set.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["src/bingraph"]

[tool.coverage.html]
directory = "htmlcov"
