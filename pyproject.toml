[project]
name = "pybingraph"
dynamic = ["version"]
description = "Binary inspection API and UI using angr"
readme = "README.md"
authors = [
    { name = "Manel Fernandez", email = "manel.fernandez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Keep the release on the IR stack validated by our unit and golden corpuses.
    "angr==9.3.0",
    "angr-utils>=0.5.0",
    # PyVEX needs ConstBitStream, which bitstring 5 removed.
    "bitstring>=4.4,<5",
    "cxxfilt>=0.3.0",
    "fastapi>=0.111.0",
    "graphviz>=0.20.3",
    "httpx2>=2.4.0",
    "jinja2>=3.1.4",
    "loguru>=0.7.3",
    "pyelftools>=0.33",
    "pydantic-settings>=2.14.1",
    #"streamlit>=1.35.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.21",
    "ty>=0.0.58",
]

[project.scripts]
bingraph = "bingraph.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bingraph"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml", "/scripts/hatch_build.py"]

[tool.hatch.version]
source = "code"
path = "src/bingraph/version.py"
expression = "get_version()"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "scripts/hatch_build.py" },
    { file = "src/bingraph/version.py" },
    { git = { commit = true } },
]

[tool.pytest.ini_options]
testpaths = ["tests/units"]
markers = [
    "checkpoint: curated CFG golden regression cases",
    "slow: integration tests that require playground binaries",
]

[tool.coverage.run]
branch = true
source = ["src/bingraph"]

[tool.coverage.html]
directory = "htmlcov"
