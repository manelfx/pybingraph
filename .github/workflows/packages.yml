name: Python packages

on:
  push:
    branches: [dev, main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach files to (leave empty for build-only)'
        type: string
        default: ''
      test_pypi:
        description: 'Upload validated distributions to TestPyPI only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      python-matrix: ${{ steps.compatibility.outputs.matrix }}
      version: ${{ steps.distributions.outputs.version }}
      commit: ${{ steps.distributions.outputs.commit }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.release.tag_name || inputs.release_tag) && format('refs/tags/{0}', github.event.release.tag_name || inputs.release_tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Verify release tag and main ancestry
        if: env.RELEASE_TAG != ''
        run: |
          VERSION=$(uv run --no-project python src/bingraph/version.py)
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            printf 'Release tag %s must match v%s\n' "$RELEASE_TAG" "$VERSION" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
      - name: Check out pinned unit-test playground
        uses: actions/checkout@v4
        with:
          repository: angr/binaries
          # Match the fixture snapshot validated by our unit and golden suites.
          ref: 1df916f58887818500d9b3a8276007ce61c3c14f
          path: angr-binaries
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch pinned supplemental samples
        run: ./scripts/fetch_playground.sh
      - name: Install runtime audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz clang
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Run development checks
        run: make check UV='uv run --no-sync'
      - name: Compare checkpoint goldens
        id: checkpoints
        env:
          BINGRAPH_GOLDEN_CONFIGS: cfg_mode_custom
          BINGRAPH_GOLDEN_MODE: compare
        run: make goldens-checkpoint UV='uv run --no-sync'
      - name: Select compatibility matrix
        id: compatibility
        run: |
          matrix=$(make --silent python-matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Build and validate distributions
        id: distributions
        run: |
          uv run --no-project python src/bingraph/version.py --json > version.json
          echo "version=$(uv run --no-project python src/bingraph/version.py)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          uv build
          uv run --no-project python scripts/distributions.py
      - name: Validate complete installed runtime
        run: uv run --no-project python scripts/distributions.py --runtime
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            version.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Upload failed checkpoint candidates
        if: failure() && steps.checkpoints.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cfg-checkpoint-failures-${{ github.sha }}-${{ github.run_attempt }}
          path: tests/_actual/cfg_mode_custom/
          if-no-files-found: warn
          retention-days: 30

  compatibility:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.python-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.release.tag_name || inputs.release_tag) && format('refs/tags/{0}', github.event.release.tag_name || inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: distributions-${{ github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz clang
      - name: Validate installed wheel compatibility
        run: uv run --no-project python scripts/distributions.py --python-versions '${{ matrix.python }}'

  attach:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, compatibility, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions-${{ github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Attach files without replacing existing assets
        run: |
          uv run --no-project python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          # The REST by-tag endpoint excludes drafts. Let gh find either kind,
          # then fetch raw REST metadata to retain asset digests and immutability.
          release_id = subprocess.check_output(
              ["gh", "release", "view", os.environ["RELEASE_TAG"],
               "--json", "databaseId", "--jq", ".databaseId"], text=True,
          ).strip()
          release = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['GH_REPO']}/releases/{release_id}"],
              text=True,
          ))
          assets = {asset["name"]: asset for asset in release["assets"]}
          files = [*Path("dist").glob("*.whl"), *Path("dist").glob("*.tar.gz")]
          if len(files) != 2:
              raise SystemExit("Expected one wheel and one source distribution to attach")
          pending = []
          for path in files:
              existing = assets.get(path.name)
              digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              if existing is not None:
                  if existing.get("digest") != digest:
                      raise SystemExit(f"Existing asset differs; refusing to overwrite {path.name}")
                  print(f"Already attached: {path.name}")
              else:
                  pending.append(path)
          if pending and release.get("immutable"):
              raise SystemExit("Attach files to a draft before publishing an immutable release")
          for path in pending:
              subprocess.run(["gh", "release", "upload", os.environ["RELEASE_TAG"], str(path)], check=True)
          PY

  container:
    needs: [build, compatibility]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Intermediate per-platform tags never become customer release tags until
      # BOTH native builds and HTTP smoke tests have succeeded.
      IMAGE: ghcr.io/${{ github.repository }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          # uv export may evaluate the project's Git-derived version metadata.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: distributions-${{ github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Install fixture compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
      - name: Build container from the audited wheel and locked dependencies
        run: uv run --no-project python scripts/container.py build --platform linux/${{ matrix.arch }}
      - name: Audit non-root server with read-only inputs
        run: uv run --no-project python scripts/container.py check
      - name: Authenticate to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested platform image
        if: github.event_name == 'release'
        run: |
          IMAGE=${IMAGE,,}
          docker tag pybingraph:local "$IMAGE:sha-$COMMIT-${{ matrix.arch }}"
          docker push "$IMAGE:sha-$COMMIT-${{ matrix.arch }}"

  publish-container:
    if: github.event_name == 'release'
    needs: [build, container, attach]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT: ${{ needs.build.outputs.commit }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested multi-platform release
        run: |
          IMAGE=${IMAGE,,}
          docker buildx imagetools create --tag "$IMAGE:sha-$COMMIT" \
            "$IMAGE:sha-$COMMIT-amd64" "$IMAGE:sha-$COMMIT-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$COMMIT" --format '{{.Manifest.Digest}}')
          # Never silently replace an existing version with different image bytes.
          if existing=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}' 2> registry-error.log); then
            test "$existing" = "$digest" || { echo 'Existing image differs; refusing overwrite' >&2; exit 1; }
          elif grep -qiE 'manifest unknown|no such manifest|: not found' registry-error.log; then
            docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$digest"
          else
            # Authentication/network failures are not evidence that a tag is absent.
            cat registry-error.log >&2
            exit 1
          fi
      - name: Update latest only for GitHub's current stable release
        if: github.event.release.prerelease == false
        run: |
          IMAGE=${IMAGE,,}
          # A rerun of an older release, or a prerelease, must not move latest.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$RELEASE_TAG" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          fi

  publish-pypi:
    # Never publish on a branch push or while preparing a draft release.
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: [build, attach]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/pybingraph
    permissions:
      contents: read
      id-token: write
    steps:
      # Only the stdlib staging checker runs here; builds/tests have no OIDC grant.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: distributions-${{ github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Verify existing PyPI files and stage missing originals
        run: uv run --no-project python scripts/distributions.py --index pypi
      - name: Publish to PyPI with Trusted Publishing
        if: hashFiles('upload/*') != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: upload/
          attestations: true

  publish-testpypi:
    # Explicit opt-in; never upload each dev commit or send trial files to PyPI.
    if: github.event_name == 'workflow_dispatch' && inputs.test_pypi
    needs: [build, compatibility, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pybingraph
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: distributions-${{ github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Verify existing TestPyPI files and stage missing originals
        run: uv run --no-project python scripts/distributions.py --index testpypi
      - name: Publish to TestPyPI with Trusted Publishing
        if: hashFiles('upload/*') != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/
          attestations: true
