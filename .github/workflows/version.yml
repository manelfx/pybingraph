name: Version

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Compute version and development badge
        run: |
          uv run --no-project python src/bingraph/version.py --json > version.json
          uv run --no-project python - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads(Path("version.json").read_text())
          version, commit = info["version"], info["commit"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Bingraph {version}\n\nCommit: `{commit}`\n")
          Path("badge").mkdir()
          Path("badge/version.svg").write_text(
              '<svg xmlns="http://www.w3.org/2000/svg" width="180" height="20" '
              'role="img" aria-label="dev version: ' + version + '">'
              '<rect width="95" height="20" fill="#555"/>'
              '<rect x="95" width="85" height="20" fill="#167d46"/>'
              '<g fill="white" font-family="Verdana,sans-serif" font-size="11" '
              'text-anchor="middle">'
              '<text x="47" y="14">dev version</text>'
              '<text x="137" y="14">' + version + '</text></g></svg>'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: version-${{ github.sha }}
          path: version.json
          overwrite: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/dev'
        with:
          path: badge

  badge:
    if: github.ref == 'refs/heads/dev'
    needs: version
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
